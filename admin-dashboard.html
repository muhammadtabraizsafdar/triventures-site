<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard</title>
<style>
  :root { --available: #ffffff; --booked: #fef2f2; --selected: #f0fdf4; --text-dark: #333; --text-light: #fff; --jump-seat: #f8fafc; }
  body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; background-color: #f4f4f9; margin: 0; }
  
  /* Login Modal */
  #loginOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.65); display: flex; justify-content: center;
    align-items: center; z-index: 9999;
  }
  .login-card {
    background: white; padding: 30px 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 15px;
  }
  .login-card h2 { margin: 0 0 10px 0; text-align: center; color: #1e293b; }
  .login-group { display: flex; flex-direction: column; gap: 5px; }
  .login-group label { font-size: 0.85rem; font-weight: bold; color: #475569; }
  .login-group input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
  .btn-login { background: #2196F3; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  .btn-login:hover { background: #1976D2; }
  .login-error { color: #dc2626; font-size: 0.85rem; text-align: center; display: none; }

  /* Dashboard Styles */
  #dashboardContent { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; }
  .admin-header { background: #333; color: white; padding: 15px 30px; border-radius: 8px; width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; box-sizing: border-box; }
  .admin-header h1 { margin: 0; font-size: 1.2rem; }
  .controls select, .controls input { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit; }
  .trip-name-group { width: 100%; margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .booking-container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; box-sizing: border-box; }
  .actions { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
  button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  .btn-save { background: #2196F3; color: white; }
  .btn-clear { background: #ef4444; color: white; }
  .btn-logout { background: #64748b; color: white; padding: 6px 12px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; }
  .legend { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; font-size: 14px; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  
  .box { width: 22px; height: 26px; border-radius: 3px 3px 8px 8px; border: 1px solid #cbd5e1; border-top: 6px solid #94a3b8; }
  .box.avail { background: #a3d9a5; border-color: #81c784; border-top-color: #66bb6a; }
  .box.fixed { background: #e2e8f0; border-color: #cbd5e1; border-top-color: #94a3b8; }
  .box.book { background: #fef2f2; border-color: #ef4444; border-top-color: #dc2626; }
  .box.sel { background: #f0fdf4; border-color: #22c55e; border-top-color: #166534; }

  .vehicle { border: 3px solid #e5e7eb; border-radius: 20px 20px 8px 8px; padding: 25px 20px; background: #fdfaf0; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.02); }
  .row { display: flex; justify-content: space-between; gap: 10px; }
  
  .seat { 
      width: 45px; height: 52px; background: #a3d9a5; 
      border: 2px solid #81c784; border-top: 12px solid #66bb6a; 
      border-radius: 6px 6px 16px 16px; display: flex; align-items: center; 
      justify-content: center; font-weight: bold; cursor: pointer; color: #145214;
      box-shadow: 0 3px 5px rgba(0,0,0,0.06); transition: all 0.1s ease;
  }
  
  .seat.fixed { background: #e2e8f0; border-color: #cbd5e1; border-top-color: #94a3b8; color: #475569; }
  .seat.jump { background: #e2e8f0; border-color: #cbd5e1; border-top-color: #94a3b8; color: #475569; width: 35px; height: 42px; border-top-width: 8px; border-radius: 4px 4px 12px 12px; align-self: center; font-size: 13px; }
  .seat.driver { background: #f1f5f9; border-color: #cbd5e1; border-top-color: #64748b; color: #64748b; cursor: not-allowed; }
  .seat.empty { background: transparent; border: none; box-shadow: none; pointer-events: none; }
  .seat:not(.driver):not(.empty):hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
  .seat.selected { background: var(--selected); border-color: #22c55e; border-top-color: #166534; color: #166534; }
  .seat.booked { background: var(--booked); border-color: #ef4444; border-top-color: #dc2626; color: #991b1b; }
</style>
</head>
<body>

<!-- Login Modal Overlay -->
<div id="loginOverlay">
  <div class="login-card">
    <h2>Owner Login</h2>
    <div class="login-group">
      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" placeholder="Enter username">
    </div>
    <div class="login-group">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="Enter password">
    </div>
    <div class="login-error" id="loginError">Invalid username or password.</div>
    <button class="btn-login" id="loginBtn">Log In</button>
  </div>
</div>

<!-- Main Dashboard Container -->
<div id="dashboardContent">
  <div class="admin-header">
    <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
      <h1>Owner Dashboard</h1>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
    <div class="controls" style="margin-top: 10px; width: 100%;">
      <select id="vehicleSelect" style="width: 100%;">
        <option value="coaster">Toyota Coaster</option>
        <option value="cabin">Grand Cabin</option>
      </select>
    </div>
    <div class="trip-name-group">
        <label for="tripNameInput" style="font-size: 0.9rem;">Current Trip Name / Destination:</label>
        <input type="text" id="tripNameInput" placeholder="e.g., Swat Valley Tour (25 Aug - 28 Aug)">
    </div>
  </div>

  <div class="booking-container">
    <div class="legend">
      <div class="legend-item"><div class="box avail"></div> Available</div>
      <div class="legend-item"><div class="box fixed"></div> Jump/Fixed</div>
      <div class="legend-item"><div class="box book"></div> Booked</div>
    </div>
    <div class="vehicle" id="vehicleMap"></div>
    <div class="actions">
      <button class="btn-clear" id="clearBtn">Clear Trip</button>
      <button class="btn-save" id="saveBtn">Save to Server</button>
    </div>
  </div>
</div>

<script>
  const API_URL = '/api/booking';
  const VALID_USER = "triventuresofficial7";
  const VALID_PASS = "#TriVentures007";

  // Auth Handling
  const loginOverlay = document.getElementById('loginOverlay');
  const dashboardContent = document.getElementById('dashboardContent');
  const usernameInput = document.getElementById('usernameInput');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const logoutBtn = document.getElementById('logoutBtn');

  function checkSession() {
    const savedUser = sessionStorage.getItem('adminUser');
    const savedPass = sessionStorage.getItem('adminPass');

    if (savedUser === VALID_USER && savedPass === VALID_PASS) {
      loginOverlay.style.display = 'none';
      dashboardContent.style.display = 'flex';
      loadAdminData(currentVehicle);
    } else {
      loginOverlay.style.display = 'flex';
      dashboardContent.style.display = 'none';
    }
  }

  loginBtn.addEventListener('click', () => {
    const u = usernameInput.value.trim();
    const p = passwordInput.value.trim();

    if (u === VALID_USER && p === VALID_PASS) {
      sessionStorage.setItem('adminUser', u);
      sessionStorage.setItem('adminPass', p);
      loginError.style.display = 'none';
      checkSession();
    } else {
      loginError.style.display = 'block';
    }
  });

  logoutBtn.addEventListener('click', () => {
    sessionStorage.removeItem('adminUser');
    sessionStorage.removeItem('adminPass');
    usernameInput.value = '';
    passwordInput.value = '';
    checkSession();
  });

  // Seat Configuration
  const layouts = {
    coaster: { 
        map: [
            ['S', '_', '_', 'D'],
            ['F', 'J', 'S', 'S'],
            ['_', 'J', 'S', 'S'],
            ['S', 'J', 'S', 'S'],
            ['S', 'J', 'S', 'S'],
            ['S', 'J', 'S', 'S'],
            ['S', 'J', 'S', 'S'],
            ['F', 'F', 'F', 'F']
        ] 
    },
    cabin: { 
        map: [
            ['S', '_', '_', 'D'],
            ['S', 'S', 'S', 'S'],
            ['S', 'J', 'S', 'S'],
            ['S', 'J', 'S', 'S'],
            ['S', 'S', 'S', 'S']
        ] 
    }
  };

  const vehicleSelect = document.getElementById('vehicleSelect');
  const tripNameInput = document.getElementById('tripNameInput');
  const vehicleMap = document.getElementById('vehicleMap');
  const saveBtn = document.getElementById('saveBtn');
  const clearBtn = document.getElementById('clearBtn');
  
  let currentVehicle = 'coaster';
  let serverData = { coaster: { tripName: "", seats: [] }, cabin: { tripName: "", seats: [] } };

  async function loadAdminData(type) {
    currentVehicle = type;
    try {
      const response = await fetch(API_URL);
      if (!response.ok) throw new Error('Failed to load data');
      const rawData = await response.json();
      
      if (Array.isArray(rawData[type])) {
          serverData[type] = { tripName: "", seats: rawData[type] };
      } else {
          serverData[type] = rawData[type] || { tripName: "", seats: [] };
      }
      
      tripNameInput.value = serverData[type].tripName || "";
      renderVehicle(type, serverData[type].seats || []);

    } catch (error) {
      console.error("Error fetching data:", error);
      renderVehicle(type, []);
    }
  }

  function renderVehicle(type, bookedSeats) {
    const config = layouts[type];
    vehicleMap.innerHTML = ''; 
    let seatNumber = 1;

    config.map.forEach(rowData => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row';

      rowData.forEach(cell => {
        const seatDiv = document.createElement('div');
        
        if (cell === '_') {
          seatDiv.className = 'seat empty';
        } else if (cell === 'D') {
          seatDiv.className = 'seat driver'; seatDiv.textContent = 'D';
        } else {
          let seatClass = 'seat';
          if (cell === 'J') seatClass += ' jump';
          if (cell === 'F') seatClass += ' fixed';
          
          seatDiv.className = seatClass;
          seatDiv.textContent = seatNumber;
          seatDiv.dataset.seatId = seatNumber;
          
          if (bookedSeats.includes(seatNumber.toString())) {
            seatDiv.classList.add('booked');
          }

          seatDiv.addEventListener('click', function() {
            if (this.classList.contains('booked')) {
              this.classList.remove('booked');
            } else if (this.classList.contains('selected')) {
              this.classList.remove('selected');
              this.classList.add('booked');
            } else {
              this.classList.add('selected');
            }
          });
          seatNumber++;
        }
        rowDiv.appendChild(seatDiv);
      });
      vehicleMap.appendChild(rowDiv);
    });
  }

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    const seatsToSave = [];
    document.querySelectorAll('.seat:not(.empty):not(.driver)').forEach(seat => {
      if (seat.classList.contains('selected') || seat.classList.contains('booked')) {
        seatsToSave.push(seat.dataset.seatId);
        seat.classList.remove('selected');
        seat.classList.add('booked');
      }
    });

    serverData[currentVehicle] = {
        tripName: tripNameInput.value.trim(),
        seats: seatsToSave
    };

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'x-admin-username': sessionStorage.getItem('adminUser'),
          'x-admin-password': sessionStorage.getItem('adminPass')
        },
        body: JSON.stringify(serverData)
      });
      
      if (response.status === 401) {
        alert("Session expired or invalid credentials. Please log in again.");
        logoutBtn.click();
        return;
      }

      if (!response.ok) throw new Error('Save failed');
      alert(`Saved! The trip name and seats are now live.`);
    } catch (error) {
      console.error(error);
      alert("Error saving data. Please check connection.");
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save to Server';
    }
  });

  clearBtn.addEventListener('click', () => {
    if (confirm("Clear all bookings and trip name for this vehicle?")) {
      tripNameInput.value = "";
      document.querySelectorAll('.seat').forEach(seat => {
        seat.classList.remove('booked', 'selected');
      });
      saveBtn.click();
    }
  });

  vehicleSelect.addEventListener('change', (e) => loadAdminData(e.target.value));

  // Initialize session check
  checkSession();
</script>
</body>
</html>
